{% for title_and_path in site.data.settings.header_pages %}
    {% assign item = site.documents | concat: site.pages | where: "path", title_and_path.path | first %}
    {% if item %}
        <a class="{% if page.url == item.url %}nav-active{% else %}nav-link{% endif %}" href="{{ item.url | relative_url }}">{{ title_and_path.title | default: item.title }}</a>
    {% endif %}
{% endfor %}
